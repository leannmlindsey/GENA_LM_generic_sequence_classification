# GENA-LM LAMBDA_v1 replication config.
#
# Sourced by:
#   slurm_scripts/lambda_replication/run_lambda_training.sh
#   slurm_scripts/lambda_replication/run_lambda_inference.sh
#
# This mirrors the ProkBERT lambda_replication pipeline. The ONLY substantive
# change from the previous GENA-LM LAMBDA runs is the input dataset: it now
# reads LAMBDA_v1/train_val_test/<W>/{train,val,test}.csv instead of the old
# v0 merged_datasets_filtered/<W>/ path. Model code and hyperparameters are
# unchanged — the variant presets below are copied verbatim from
# submit_train_all_windows.sh / submit_embedding_analysis_all.sh.
#
# Workflow:
#   1. Edit the REQUIRED paths + the OPTIONAL Surface B/C diagnostic paths.
#   2. bash slurm_scripts/lambda_replication/run_lambda_training.sh
#   3. Wait for jobs:  squeue -u $USER
#   4. bash slurm_scripts/lambda_replication/run_lambda_inference.sh

# ─── REQUIRED ────────────────────────────────────────────────────────────────

# LAMBDA_v1 dataset root. Expected layout:
#   $LAMBDA_BASE/train_val_test/<W>/{train,val,test}.csv   (Surface A: binary test)
# Surface B/C diagnostic paths are set per-window further down (FPR_/GC_/FNR_/
# GENOME_WIDE_). Do NOT point this at the old v0
# /home/lindseylm/lindseylm/lambda_final/merged_datasets_filtered/ path.
export LAMBDA_BASE="/vf/users/Irp-jiang/share/lindseylm/LAMBDA_v1"

# Replication output root. Per-window results land under here:
#   $OUTPUT_DIR/<W>/finetune/<variant>/seed-<N>/   test_results.json + checkpoint
#   $OUTPUT_DIR/<W>/embedding/<variant>/           embedding_analysis_results.json + .npz + .pkl
#   $OUTPUT_DIR/<W>/winners.json                   best seed per variant (eval_mcc)
#   $OUTPUT_DIR/<W>/inference/<variant>/           {test,fpr,fnr,gc_control}_predictions.csv
#                                                  + genome_wide_<asm>_*_predictions.csv
#   $OUTPUT_DIR/logs/                              SLURM stdout/stderr (shared)
export OUTPUT_DIR="/data/lindseylm/GLM_EVALUATIONS/NAR_GENOMICS_LAMBDA_REPO/GENA_LM_generic_sequence_classification/outputs"

# Windows to run. Each becomes a separate output subdirectory.
# Set to a single value (e.g. "2k") to run only one window.
export WINDOWS="2k 4k 8k"

# Variants to sweep. Presets (model_name + LR + WD + scheduler) are defined in
# the variant_preset() block in run_lambda_training.sh — these are copied
# verbatim from submit_train_all_windows.sh:
#   bigbird     AIRI-Institute/gena-lm-bigbird-base-t2t  LR=1e-4 WD=0    constant_with_warmup
#   moderngena  AIRI-Institute/moderngena-base           LR=3e-5 WD=1e-3 linear
#   bertbase    AIRI-Institute/gena-lm-bert-base-t2t      LR=1e-4 WD=0    constant_with_warmup
# Default mirrors the two variants you ran full LAMBDA sweeps for. Add bertbase
# here if you want it (note: BERT-base caps at 512 tokens, so 4k/8k truncate).
export VARIANTS="bigbird moderngena"

# Random seeds for finetuning — one finetune job per (variant × window × seed).
# winners.json picks the best-of-N seed per (variant × window) by eval_mcc.
export SEEDS="1 2 3 4 5"

# ─── OPTIONAL: Surface B/C diagnostics (per-window) ──────────────────────────
#
# Each is looked up by name FPR_<W> / GC_<W> / FNR_<W> / GENOME_WIDE_<W>.
# Leave any value empty ("") to SKIP that diagnostic for that window — the
# inference driver warns and continues, so a partial config still runs.
#
# !!! VERIFY THESE AGAINST THE ACTUAL LAMBDA_v1 LAYOUT ON BIOWULF !!!
# The FPR/GC defaults below follow the ProkBERT LAMBDA_v1 convention; FNR and
# GENOME_WIDE had no v1 path wired up yet, so they are left blank for you to
# fill with the LAMBDA_v1 equivalents (do NOT use the old v0
# /home/lindseylm/lindseylm/lambda_final/ paths).

# Surface B — FPR (bacteria-only; false-positive-rate control). One CSV/window.
export FPR_2k="${LAMBDA_BASE}/fpr_test/2k/bacteria_segments_2k.csv"
export FPR_4k="${LAMBDA_BASE}/fpr_test/4k/bacteria_segments_4k.csv"
export FPR_8k="${LAMBDA_BASE}/fpr_test/8k/bacteria_segments_8k.csv"

# Surface B — GC control (GC-preserving shuffled sequences). One CSV/window.
export GC_2k="${LAMBDA_BASE}/shuffled_controls/2k/test_shuffled.csv"
export GC_4k="${LAMBDA_BASE}/shuffled_controls/4k/test_shuffled.csv"
export GC_8k="${LAMBDA_BASE}/shuffled_controls/8k/test_shuffled.csv"

# Surface B — FNR (phage-only; false-negative-rate control). One CSV/window.
# Copied into LAMBDA_v1 from the original phage_only_annotations/segments set.
# NOTE: 2k uses the phrog-annotated variant (also drives the paper/website
# figure); it is a smaller, different segment set than the 4k/8k sliding-window
# files, so 2k FNR is measured on that annotated subset by design.
export FNR_2k="${LAMBDA_BASE}/fnr_test/2k/phage_annotated_segments_2k.csv"
export FNR_4k="${LAMBDA_BASE}/fnr_test/4k/phage_segments_4k_2k.csv"
export FNR_8k="${LAMBDA_BASE}/fnr_test/8k/phage_segments_8k_4k.csv"

# Surface C — genome-wide. Each is a DIRECTORY of *.csv segment files (one
# inference run per directory; outputs are renamed genome_wide_<asm>_*_predictions.csv
# so the harvest pipeline picks them up). Copied/symlinked into LAMBDA_v1 from
# the original phoenix/segments/{2k_1k,4k_2k,8k_4k} dirs.
export GENOME_WIDE_2k="${LAMBDA_BASE}/genome_wide/2k"
export GENOME_WIDE_4k="${LAMBDA_BASE}/genome_wide/4k"
export GENOME_WIDE_8k="${LAMBDA_BASE}/genome_wide/8k"

# ─── OPTIONAL: finetune hyperparameters ──────────────────────────────────────
# Copied verbatim from run_train_gena_lm.sh. LR / WD / scheduler / model_name
# are NOT here — they come from the per-variant preset (see VARIANTS above).
export EPOCHS="10"
export BATCH_SIZE="4"                     # BigBird at 2048 tok is memory-heavy
export GRADIENT_ACCUMULATION_STEPS="16"   # effective batch = 64
export WARMUP_RATIO="0.06"
export EARLY_STOPPING_PATIENCE="7"
export EVAL_STEPS="100"
export SAVE_STEPS="100"
export SAVE_TOTAL_LIMIT="1"               # with --save_only_model ≈ 500 MB/seed
export PRECISION="bf16"                   # bf16 | fp16 | fp32

# ─── OPTIONAL: embedding-analysis hyperparameters (Surface D) ────────────────
# Copied verbatim from submit_embedding_analysis_all.sh / run_embedding_analysis.sh.
# Embeddings come from the PRE-TRAINED base model (not the finetuned checkpoint),
# so Surface D does not depend on the winning seed and runs in the training stage.
export EMB_BATCH_SIZE="16"                 # embedding batch (separate from finetune BATCH_SIZE)
export POOLING="mean"                     # mean | cls | last
export NN_EPOCHS="100"
export NN_HIDDEN_DIM="256"
export NN_LR="0.001"
export EMB_SEED="42"
export INCLUDE_RANDOM_BASELINE="true"     # adds random-init baseline + embedding power

# ─── OPTIONAL: inference hyperparameters ─────────────────────────────────────
export INF_BATCH_SIZE="16"
export THRESHOLD="0.5"

# ─── OPTIONAL: SLURM resources ───────────────────────────────────────────────
export FT_MEM="64g"
export FT_TIME="16:00:00"
export EMB_MEM="64g"
export EMB_TIME="4:00:00"
export INF_MEM="32g"
export INF_TIME="2:00:00"

# ─── Biowulf offline-cache settings ──────────────────────────────────────────
# Avoid 503s on the Biowulf HTTPS proxy: run fully offline and use a persistent
# HF cache. Pre-warm the cache once from a LOGIN node before submitting, e.g.:
#   module load conda; conda activate gena_lm
#   export HF_HOME=/data/lindseylm/.cache/huggingface
#   python - <<'PY'
#   from transformers import AutoTokenizer, AutoModel
#   for m in ["AIRI-Institute/gena-lm-bigbird-base-t2t",
#             "AIRI-Institute/moderngena-base"]:
#       AutoTokenizer.from_pretrained(m, trust_remote_code=True)
#       AutoModel.from_pretrained(m, trust_remote_code=True)
#   PY
# After pre-warming, jobs run with HF_HUB_OFFLINE=1 (set by the job scripts).
export HF_HOME="/data/lindseylm/.cache/huggingface"
